name: Release Windows exe

# AUTOMATIC: jab bhi laptop app ki files (index.html, icons, desktop/) main mein badalti hain, yeh nayi version khud
# banata aur GitHub Release mein publish karta hai (v1.0.2 -> v1.0.3 ...). Laptop app khud nayi version dhoond kar
# update karti hai. Manual chalana ho to Actions -> Run workflow (version khali chor dein, ya jaise 1.1.0 likhein).
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'icons/**'
      - 'desktop/**'
      - '.github/workflows/release-windows-exe.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional: version (jaise 1.1.0). Khali = pichli version ka agla number'
        required: false

concurrency:
  group: release-exe
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check (kharab code release nahi hoga)
        run: node desktop/scripts/check-syntax.js
      - name: Decide version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            V="$INPUT_VERSION"
          else
            LAST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
            if [ -z "$LAST" ]; then V="1.0.1"; else
              LAST=${LAST#v}; MAJ=${LAST%%.*}; REST=${LAST#*.}; MIN=${REST%%.*}; PAT=${REST#*.}
              V="$MAJ.$MIN.$((PAT+1))"
            fi
          fi
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "Bad version: $V"; exit 1; fi
          echo "Releasing version $V"
          echo "RELEASE_VERSION=$V" >> "$GITHUB_ENV"
      - name: Install
        working-directory: desktop
        run: npm install
      - name: Set version
        working-directory: desktop
        shell: bash
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
      - name: Build and publish release
        working-directory: desktop
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
